<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Jebbett Gardening</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/jebbett-logo.jpeg">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="booking.html">Book a Service</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="page-hero">
            <h1>Welcome Back</h1>
            <p>Log in to manage your bookings.</p>
        </section>

        <section class="auth-section">
            <div class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Your password">
                </div>
                <button class="btn" id="login-btn">Log In</button>
                <p class="auth-link">Don't have an account? <a href="signup.html">Sign up here</a></p>
            </div>
        </section>

    </main>

    <footer>
        <div class="footer-logo">Jebbett Gardening</div>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="booking.html">Book a Service</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="footer-copy">
            <p>&copy; 2026 Jebbett Gardening. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
